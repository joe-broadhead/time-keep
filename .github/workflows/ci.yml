name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Test
        run: cargo test --locked --all-features

  platform-build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            ext: ""
          - os: macos-26
            target: aarch64-apple-darwin
            asset: macos-arm64
            ext: ""
          - os: macos-26-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target "${TARGET_TRIPLE}"
          rustup default "${RUST_TOOLCHAIN}"

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Build release target
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: cargo build --locked --release --all-features --target "${TARGET_TRIPLE}"

      - name: Smoke system timezone detection
        shell: bash
        env:
          BIN_EXT: ${{ matrix.ext }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET_TRIPLE}/release/time-keep${BIN_EXT}"
          "${bin}" --version
          env -u TZ TIME_KEEP_TZ=system "${bin}" --config /nonexistent/time-keep/config.toml now

  docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build Docs
        run: mkdocs build --strict

  deny:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install cargo-deny
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2
        with:
          tool: cargo-deny@0.19.0

      - name: Supply-chain checks
        run: cargo deny check

  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install cargo-audit
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: RustSec audit
        run: cargo audit
